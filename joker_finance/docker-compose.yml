version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: joker_finance_db
    environment:
      POSTGRES_USER: joker
      POSTGRES_PASSWORD: joker_password
      POSTGRES_DB: joker_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U joker"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: joker_finance_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joker_finance_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://joker:joker_password@postgres:5432/joker_finance
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joker_finance_celery
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://joker:joker_password@postgres:5432/joker_finance
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./backend:/app
    command: celery -A app.celery worker --loglevel=info

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: joker_finance_celery_beat
    depends_on:
      - redis
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app
    command: celery -A app.celery beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
